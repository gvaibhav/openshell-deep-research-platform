name: Exact digest release security

'on':
  workflow_dispatch:
  schedule:
    - cron: '17 08 * * *'

permissions:
  contents: read

concurrency:
  group: exact-digest-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    name: digest CVE, KEV, and SBOM gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RELEASE_MANIFEST: ${{ github.event_name == 'schedule' && 'scripts/build_security/deployed-manifest.json' || 'scripts/build_security/release-manifest.json' }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Require protected default branch
        run: test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.17'
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.1
      - name: Scan every manifest digest and verify fresh complete evidence
        run: python -m scripts.build_security.scan release --manifest "$RELEASE_MANIFEST" --repository-root . --output "$RUNNER_TEMP/release-evidence"
      - name: Retain digest-linked scan, SBOM, scanner, and KEV evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: exact-digest-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-evidence
          if-no-files-found: ignore
          retention-days: 90
